<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nandini — your assistant</title>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  :root{
    --pink-bg1:#FCE8F0; --pink-bg2:#F7D3E2;
    --surface:#FFFFFF; --surface-tint:#FFF6FA;
    --rose:#E0688A; --rose-deep:#B34968;
    --ink:#44313A; --ink-soft:#9A8791;
    --line:#F2D8E2; --line-soft:#F8E6EE;
    --ball:#C7DA3B; --ball-deep:#A9BE2E;
    --radius:22px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; font-family:var(--font); color:var(--ink); overflow-x:hidden;
    background:linear-gradient(160deg,var(--pink-bg1) 0%,var(--pink-bg2) 100%);
    -webkit-font-smoothing:antialiased; min-height:100%; }
  .bg-court{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5; }
  .shell{ position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:22px 16px; }
  .card{ width:100%; max-width:760px; background:var(--surface); border-radius:var(--radius);
    box-shadow:0 20px 50px -18px rgba(150,60,95,.35), 0 2px 10px rgba(150,60,95,.08);
    display:flex; flex-direction:column; overflow:hidden; height:min(88vh,880px); }

  header.hd{ padding:20px 22px 12px; border-bottom:1px solid var(--line-soft); }
  header.hd .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header.hd h1{ margin:0; font-size:22px; font-weight:600; letter-spacing:-0.02em; }
  header.hd p{ margin:3px 0 0; font-size:13px; color:var(--ink-soft); }
  .hd-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .bell{ display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface-tint); cursor:pointer; color:var(--rose-deep); font-family:var(--font); font-size:12.5px; font-weight:500; transition:.15s; }
  .bell:hover{ border-color:var(--rose); } .bell.on{ background:var(--rose); color:#fff; border-color:var(--rose); }
  .testbtn{ height:34px; padding:0 12px; border-radius:999px; border:1px dashed var(--line); background:none; color:var(--ink-soft); cursor:pointer; font-family:var(--font); font-size:12px; }
  .testbtn:hover{ border-color:var(--rose); color:var(--rose-deep); }

  nav.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin:14px 22px 0; }
  nav.tabs button{ border:none; background:none; cursor:pointer; padding:10px 16px; font-family:var(--font); font-size:14px; font-weight:500; color:var(--ink-soft); border-bottom:2px solid transparent; margin-bottom:-1px; }
  nav.tabs button.active{ color:var(--rose-deep); border-bottom-color:var(--rose); }

  .view{ flex:1; min-height:0; display:none; flex-direction:column; }
  .view.active{ display:flex; }

  /* chat */
  .log{ flex:1; overflow-y:auto; padding:20px 20px 8px; display:flex; flex-direction:column; gap:13px; }
  .msg{ display:flex; }
  .msg.me{ justify-content:flex-end; }
  .bubble{ max-width:82%; padding:11px 15px; font-size:14.5px; line-height:1.5; border-radius:18px; }
  .msg.bot .bubble{ background:var(--surface-tint); border:1px solid var(--line); border-bottom-left-radius:6px; border-left:4px solid var(--rose); }
  .msg.bot .bubble.t-event{ border-left-color:#E0688A; background:#FFF3F7; }
  .msg.bot .bubble.t-reminder{ border-left-color:#E6A93B; background:#FFF8EE; }
  .msg.bot .bubble.t-todo{ border-left-color:#6E85A0; background:#F2F6FB; }
  .msg.bot .bubble.t-info{ border-left-color:var(--ball-deep); background:#FBFDEE; }
  .msg.me .bubble{ background:linear-gradient(135deg,var(--rose),#D2577E); color:#fff; border-bottom-right-radius:6px; box-shadow:0 4px 12px rgba(200,80,120,.3); }
  .bubble .chip{ display:inline-flex; align-items:center; gap:6px; margin-top:9px; padding:5px 10px; border-radius:10px; background:#fff; border:1px solid var(--line); font-size:12.5px; font-weight:600; }
  .bubble .chip .tdot{ width:8px; height:8px; border-radius:50%; }
  .suggests{ display:flex; flex-wrap:wrap; gap:8px; padding:2px 20px 4px; }
  .suggests button{ font-family:var(--font); font-size:12.5px; color:var(--rose-deep); background:var(--surface-tint); border:1px solid var(--line); border-radius:999px; padding:7px 13px; cursor:pointer; transition:.15s; }
  .suggests button:hover{ background:#fff; border-color:var(--rose); }
  .inputbar{ display:flex; align-items:flex-end; gap:10px; padding:14px 18px 18px; border-top:1px solid var(--line-soft); }
  .inputbar textarea{ flex:1; resize:none; font-family:var(--font); font-size:14.5px; color:var(--ink); line-height:1.4; border:1px solid var(--line); border-radius:16px; padding:12px 14px; background:var(--surface-tint); max-height:120px; min-height:46px; outline:none; transition:border-color .15s; }
  .inputbar textarea:focus{ border-color:var(--rose); background:#fff; }
  .send{ flex-shrink:0; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; padding:0; background:radial-gradient(circle at 34% 32%, #DCEE55, var(--ball) 70%, var(--ball-deep)); box-shadow:0 4px 12px rgba(150,170,40,.4); display:flex; align-items:center; justify-content:center; transition:transform .12s; }
  .send:hover{ transform:scale(1.06); } .send:active{ transform:scale(.94); }

  .scroll{ flex:1; overflow-y:auto; padding:16px 18px 24px; }

  /* calendar toolbar */
  .cal-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .viewseg{ display:inline-flex; background:var(--surface-tint); border:1px solid var(--line); border-radius:999px; padding:3px; }
  .viewseg button{ border:none; background:none; cursor:pointer; font-family:var(--font); font-size:12.5px; font-weight:500; color:var(--ink-soft); padding:6px 13px; border-radius:999px; }
  .viewseg button.active{ background:var(--rose); color:#fff; }
  .cal-when{ display:flex; align-items:center; gap:6px; }
  .cal-when button{ background:var(--surface-tint); border:1px solid var(--line); border-radius:9px; height:32px; min-width:32px; padding:0 10px; cursor:pointer; color:var(--rose-deep); font-size:14px; font-family:var(--font); }
  .cal-title{ font-size:16px; font-weight:600; min-width:150px; text-align:center; }
  .btn{ background:var(--rose); color:#fff; border:none; border-radius:10px; padding:9px 14px; font-size:13px; font-weight:500; cursor:pointer; font-family:var(--font); }
  .btn:hover{ background:var(--rose-deep); }
  .btn.soft{ background:var(--surface-tint); color:var(--rose-deep); border:1px solid var(--line); }

  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; font-size:12px; color:var(--ink-soft); }
  .legend .it{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  /* month */
  .mgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .dow{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); text-align:center; padding-bottom:2px; }
  .mcell{ background:var(--surface-tint); border:1px solid var(--line); border-radius:10px; min-height:74px; padding:5px; cursor:pointer; }
  .mcell:hover{ border-color:var(--rose); }
  .mcell.other{ opacity:.4; } .mcell.today .mdn{ background:var(--rose); color:#fff; }
  .mdn{ font-size:11.5px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; border-radius:50%; margin-bottom:3px; }
  .mbar{ font-size:10px; padding:2px 5px; border-radius:5px; color:#fff; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* time grid (week/day) */
  .tg{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .tg-head{ display:grid; background:var(--surface); border-bottom:1px solid var(--line); }
  .tg-head .hd-day{ text-align:center; padding:7px 2px; font-size:11px; color:var(--ink-soft); border-left:1px solid var(--line-soft); }
  .tg-head .hd-day .num{ display:block; font-size:15px; color:var(--ink); font-weight:600; }
  .tg-head .hd-day.today .num{ color:var(--rose-deep); }
  .tg-body{ position:relative; overflow-y:auto; max-height:56vh; }
  .tg-cols{ display:grid; }
  .tg-time{ height:44px; font-size:10px; color:var(--ink-soft); text-align:right; padding-right:6px; position:relative; }
  .tg-time span{ position:absolute; right:6px; top:-6px; }
  .daycol{ position:relative; border-left:1px solid var(--line-soft); background:repeating-linear-gradient(to bottom, transparent, transparent 43px, var(--line-soft) 43px, var(--line-soft) 44px); cursor:pointer; }
  .daycol.today{ background:linear-gradient(#FFF6FA,#FFF6FA), repeating-linear-gradient(to bottom, transparent, transparent 43px, var(--line-soft) 43px, var(--line-soft) 44px); }
  .evblock{ position:absolute; left:3px; right:3px; border-radius:7px; color:#fff; font-size:10.5px; line-height:1.25; padding:3px 5px; overflow:hidden; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .evblock .et{ font-weight:600; } .evblock .es{ opacity:.9; font-size:9.5px; }
  .allday{ display:flex; flex-wrap:wrap; gap:4px; padding:6px 4px; border-bottom:1px solid var(--line-soft); }
  .allday .adchip{ font-size:10px; color:#fff; padding:2px 7px; border-radius:6px; cursor:pointer; }

  /* categories / sync */
  .section{ margin-top:20px; }
  .section h3{ font-size:14px; font-weight:600; margin:0 0 10px; }
  .catlist{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .catchip{ display:flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:12.5px; border:1px solid var(--line); background:#fff; }
  .catchip .x{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:11px; }
  .rowline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=text],input[type=date],input[type=time],select{ font-family:var(--font); font-size:13.5px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface-tint); color:var(--ink); outline:none; }
  input:focus,select:focus{ border-color:var(--rose); background:#fff; }
  input[type=color]{ width:38px; height:38px; padding:2px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; }
  .sync{ display:flex; flex-wrap:wrap; gap:8px; }

  /* todos */
  .tabbar{ display:flex; gap:5px; flex-wrap:wrap; border-bottom:2px solid var(--line); margin-bottom:16px; }
  .tbtn{ background:var(--surface-tint); border:1px solid var(--line); border-bottom:none; border-radius:12px 12px 0 0; padding:9px 15px; font-size:13px; cursor:pointer; color:var(--ink-soft); font-family:var(--font); margin-bottom:-2px; }
  .tbtn.active{ background:#fff; color:var(--ink); font-weight:600; border-bottom:2px solid #fff; }
  .tbtn.add{ background:none; border:1px dashed var(--line); color:var(--rose-deep); border-radius:12px; margin-bottom:0; align-self:center; }
  .trow{ display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line-soft); font-size:14.5px; }
  .trow input[type=checkbox]{ width:18px; height:18px; accent-color:var(--rose); cursor:pointer; }
  .trow .tt{ flex:1; } .trow.done .tt{ text-decoration:line-through; color:var(--ink-soft); }
  .trow .badge{ font-size:11.5px; color:var(--rose-deep); background:var(--surface-tint); border:1px solid var(--line); border-radius:8px; padding:3px 8px; }
  .trow .badge.over{ color:#B54848; border-color:#F0CFCF; }
  .trow .x{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:6px 9px; border-radius:8px; } .trow .x:hover{ color:var(--rose-deep); background:var(--surface-tint); }
  .empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:34px 20px; }
  .empty .big{ font-size:15px; color:var(--ink); margin-bottom:6px; }

  /* modal */
  .overlay{ position:fixed; inset:0; background:rgba(60,30,45,.35); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .overlay.show{ display:flex; }
  .modal{ background:#fff; border-radius:18px; width:100%; max-width:380px; padding:20px; box-shadow:0 20px 50px rgba(120,40,70,.4); }
  .modal h3{ margin:0 0 14px; font-size:17px; font-weight:600; }
  .field{ margin-bottom:12px; } .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select{ width:100%; }
  .frow{ display:flex; gap:10px; } .frow .field{ flex:1; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; align-items:center; }
  .modal-actions .del{ margin-right:auto; background:none; border:none; color:#B54848; cursor:pointer; font-size:13px; }

  @media (max-width:600px){
    .shell{ padding:0; } .card{ height:100vh; height:100dvh; max-width:100%; border-radius:0; box-shadow:none; }
    nav.tabs{ margin:12px 14px 0; } .scroll{ padding:14px 12px 22px; }
    .bubble{ max-width:88%; } .tg-body{ max-height:62vh; }
    .cal-title{ min-width:120px; font-size:15px; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; } }
  button:focus-visible,.bell:focus-visible{ outline:2px solid var(--rose-deep); outline-offset:2px; }
</style>
</head>
<body>

<svg class="bg-court" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <pattern id="raq" width="180" height="180" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <g fill="none" stroke="#E79CBA" stroke-width="1.4" opacity="0.5">
        <g transform="translate(58,54) rotate(-22)"><ellipse cx="0" cy="-24" rx="15" ry="21"/><line x1="-9" y1="-42" x2="-9" y2="-6"/><line x1="0" y1="-45" x2="0" y2="-3"/><line x1="9" y1="-42" x2="9" y2="-6"/><line x1="-14" y1="-34" x2="14" y2="-34"/><line x1="-15" y1="-24" x2="15" y2="-24"/><line x1="-14" y1="-14" x2="14" y2="-14"/><path d="M -5,-4 L 0,4 L 5,-4"/><line x1="0" y1="4" x2="0" y2="30"/><rect x="-3" y="22" width="6" height="12" rx="2.5"/></g>
        <g transform="translate(58,54) rotate(22) scale(-1,1)"><ellipse cx="0" cy="-24" rx="15" ry="21"/><line x1="-9" y1="-42" x2="-9" y2="-6"/><line x1="0" y1="-45" x2="0" y2="-3"/><line x1="9" y1="-42" x2="9" y2="-6"/><line x1="-14" y1="-34" x2="14" y2="-34"/><line x1="-15" y1="-24" x2="15" y2="-24"/><line x1="-14" y1="-14" x2="14" y2="-14"/><path d="M -5,-4 L 0,4 L 5,-4"/><line x1="0" y1="4" x2="0" y2="30"/><rect x="-3" y="22" width="6" height="12" rx="2.5"/></g>
        <circle cx="140" cy="132" r="6" stroke="#CBB24A" opacity="0.5"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#raq)"/>
</svg>

<div class="shell">
  <div class="card">
    <header class="hd">
      <div class="row">
        <div>
          <h1 id="greeting">Hi, Nandini</h1>
          <p>Just tell me what to add — I'll place and block it for you.</p>
        </div>
        <div class="hd-actions">
          <button class="testbtn" id="testBtn">Send test</button>
          <button class="bell" id="notifBtn" aria-label="Enable reminders">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span id="bellLabel">Enable reminders</span>
          </button>
        </div>
      </div>
    </header>

    <nav class="tabs">
      <button data-view="chat" class="active">Chat</button>
      <button data-view="calendar">Calendar</button>
      <button data-view="todos">To-dos</button>
    </nav>

    <!-- CHAT -->
    <section id="chat" class="view active">
      <div class="log" id="log"></div>
      <div class="suggests">
        <button data-fill="What's on today?">What's on today?</button>
        <button data-fill="Block 2-4pm for ">Block time…</button>
        <button data-fill="Remind me to ">Remind me to…</button>
        <button data-fill="Add a to-do: ">To-do…</button>
      </div>
      <div class="inputbar">
        <textarea id="input" rows="1" placeholder="e.g. Block 7–9pm today for dinner with Sam"></textarea>
        <button class="send" id="send" aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12h13M12 6l6 6-6 6" stroke="#5C6B12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <!-- CALENDAR -->
    <section id="calendar" class="view">
      <div class="scroll">
        <div class="cal-bar">
          <div class="viewseg">
            <button data-mode="day">Day</button>
            <button data-mode="week" class="active">Week</button>
            <button data-mode="month">Month</button>
          </div>
          <div class="cal-when">
            <button id="prevBtn">‹</button>
            <span class="cal-title" id="calTitle"></span>
            <button id="nextBtn">›</button>
            <button id="todayNav" style="min-width:auto;">Today</button>
          </div>
          <button class="btn" id="newEventBtn">+ Event</button>
        </div>
        <div class="legend" id="legend"></div>
        <div id="calBody"></div>

        <div class="section">
          <h3>Categories</h3>
          <div class="catlist" id="catList"></div>
          <div class="rowline">
            <input type="text" id="catName" placeholder="New category">
            <input type="color" id="catColor" value="#E0688A">
            <button class="btn soft" id="catAdd">Add</button>
          </div>
        </div>
        <div class="section">
          <h3>Import &amp; export</h3>
          <div class="sync">
            <button class="btn soft" id="impIcs">Import .ics</button>
            <button class="btn soft" id="expIcs">Export .ics</button>
            <button class="btn soft" id="backupBtn">Back up</button>
            <button class="btn soft" id="restoreBtn">Restore</button>
            <input type="file" id="icsFile" accept=".ics,text/calendar" hidden>
            <input type="file" id="jsonFile" accept="application/json,.json" hidden>
          </div>
        </div>
      </div>
    </section>

    <!-- TODOS -->
    <section id="todos" class="view">
      <div class="scroll">
        <div class="tabbar" id="tabbar"></div>
        <div id="taskWrap"></div>
        <p class="empty" style="padding:16px 0 0; font-size:12.5px;">Add to-dos from the Chat tab — e.g. “add a to-do: call the bank”.</p>
      </div>
    </section>

  </div>
</div>

<!-- EVENT MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">New event</h3>
    <div class="field"><label>Title</label><input type="text" id="mTitle" placeholder="e.g. Dinner with Sam"></div>
    <div class="field"><label>Date</label><input type="date" id="mDate"></div>
    <div class="frow">
      <div class="field"><label>Start</label><input type="time" id="mStart"></div>
      <div class="field"><label>End</label><input type="time" id="mEnd"></div>
    </div>
    <div class="field"><label>Category</label><select id="mCat"></select></div>
    <div class="modal-actions">
      <button class="del" id="mDelete" style="display:none;">Delete</button>
      <button class="btn soft" id="mCancel">Cancel</button>
      <button class="btn" id="mSave">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
  const KEY='nandini-hub';
  const NAME='Nandini';
  const CONFIG={
    ONESIGNAL_APP_ID:"b17dd355-1344-4d1c-ae79-a17220a634f8",
    ONESIGNAL_SW_SCOPE:"/myhub1/",
    ONESIGNAL_SW_PATH:"/myhub1/OneSignalSDKWorker.js",
    REMINDER_BACKEND_URL:"https://hub-reminders.nandini-gupta-1998.workers.dev",
    SYNC_TOKEN:"syncKey_Np7q2Ex9Rf4Ka"
  };
  const TYPE={ event:{label:'Calendar event',color:'#E0688A'}, reminder:{label:'Reminder',color:'#E6A93B'}, todo:{label:'To-do',color:'#6E85A0'} };
  const HOUR_H=44;

  let data={
    categories:[
      {id:'personal',name:'Personal',color:'#E0688A'},
      {id:'work',name:'Work',color:'#C97BA0'},
      {id:'study',name:'Study',color:'#6E85A0'},
      {id:'tennis',name:'Tennis',color:'#A9BE2E'}
    ],
    tabs:[{id:'general',name:'General'}],
    events:[], tasks:[], log:[]
  };
  let mode='week', anchor=new Date(), activeTab='general', editingId=null;

  /* ---------- storage ---------- */
  async function load(){
    try{ const raw=localStorage.getItem(KEY); if(raw) data=Object.assign(data,JSON.parse(raw)); }catch(e){}
    if(!data.tabs.find(t=>t.id===activeTab)) activeTab=(data.tabs[0]||{}).id;
    greet();
    if(!data.log.length) pushBot(`Hi ${NAME}! Tell me things like <em>“block 7–9pm today for dinner with Sam”</em>, <em>“remind me at 4pm to do laundry”</em>, or <em>“add a to-do: call the bank”</em> — I'll place and block each one, and set reminders 15 minutes before.`, 'info');
    else data.log.forEach(m=>renderMsg(m.role,m.html,m.cls));
    scrollLog(); renderCal(); renderTodos(); refreshBell(); scheduleReminders();
    cloudPull();

  function greet(){ const h=new Date().getHours(); const g=h<12?'Good morning':h<18?'Good afternoon':'Good evening'; document.getElementById('greeting').textContent=`${g}, ${NAME}`; }

  /* ---------- tabs nav ---------- */

  /* ---------- notifications ---------- */
  window.OneSignalDeferred=window.OneSignalDeferred||[];
  if(CONFIG.ONESIGNAL_APP_ID && !CONFIG.ONESIGNAL_APP_ID.startsWith('PASTE')){
    OneSignalDeferred.push(async function(OneSignal){ try{ await OneSignal.init({appId:CONFIG.ONESIGNAL_APP_ID, serviceWorkerPath:CONFIG.ONESIGNAL_SW_PATH, serviceWorkerParam:{scope:CONFIG.ONESIGNAL_SW_SCOPE}, allowLocalhostAsSecureOrigin:true}); }catch(e){} });
  }

    if(CONFIG.ONESIGNAL_APP_ID && !CONFIG.ONESIGNAL_APP_ID.startsWith('PASTE')){ OneSignalDeferred.push(async function(OneSignal){ try{ await OneSignal.Notifications.requestPermission(); }catch(e){} }); }

  });
  document.getElementById('testBtn').addEventListener('click',()=>{

  });

  const timers={};
  function scheduleReminders(){
    Object.values(timers).forEach(clearTimeout);

    const td=today(), now=Date.now();
    data.events.filter(e=>e.date===td && e.start).forEach(e=>{
      addTimer('e15'+e.id, e.title+' in 15 min', minusMin(e.date,e.start,15), now);
      addTimer('e0'+e.id, e.title+' now', e.date+'T'+e.start+':00', now);

      addTimer('t'+t.id, t.text, td+'T'+t.time+':00', now);
    });
  }
  function addTimer(key,label,whenLocal,now){ const when=new Date(whenLocal).getTime(); const delay=when-now; if(delay>0 && delay<24*3600*1000){ timers[key]=setTimeout(()=>{ try{ new Notification('Reminder',{body:label}); }catch(e){} }, delay); } }
  function minusMin(date,time,m){ const d=new Date(date+'T'+time+':00'); d.setMinutes(d.getMinutes()-m); return d.toISOString(); }

  function postBackend(title,whenISO){ if(!CONFIG.REMINDER_BACKEND_URL) return; fetch(CONFIG.REMINDER_BACKEND_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,when:whenISO})}).catch(()=>{}); }
  function backendForEvent(e){ if(!e.start) return; const startISO=new Date(e.date+'T'+e.start+':00'); const t=startISO.getTime(); postBackend(e.title+' — in 15 min', new Date(t-15*60000).toISOString()); postBackend(e.title+' — starting now', new Date(t).toISOString()); }
  function backendForReminder(tk){ if(!tk.time) return; postBackend(tk.text, new Date((tk.due||today())+'T'+tk.time+':00').toISOString()); }

  /* ---------- live sync ---------- */
  function syncOn(){ return CONFIG.REMINDER_BACKEND_URL && CONFIG.SYNC_TOKEN && !CONFIG.SYNC_TOKEN.startsWith('PASTE'); }
  let pushTimer=null;
  function cloudPush(){ if(!syncOn())return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>{ fetch(CONFIG.REMINDER_BACKEND_URL+'/data',{method:'PUT',headers:{'Content-Type':'application/json','x-sync-token':CONFIG.SYNC_TOKEN},body:JSON.stringify(data)}).catch(()=>{}); },800); }
  async function cloudPull(){ if(!syncOn())return; try{ const res=await fetch(CONFIG.REMINDER_BACKEND_URL+'/data',{headers:{'x-sync-token':CONFIG.SYNC_TOKEN}}); if(!res.ok)return; const remote=await res.json(); if(remote&&remote.updatedAt&&(!data.updatedAt||remote.updatedAt>data.updatedAt)){ data=Object.assign(data,remote); if(!data.tabs.find(t=>t.id===activeTab)) activeTab=(data.tabs[0]||{}).id; try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} renderCal(); renderTodos(); rerenderChat(); scheduleReminders(); } }catch(e){} }
  function rerenderChat(){ const log=document.getElementById('log'); if(!log)return; log.innerHTML=''; (data.log||[]).forEach(m=>renderMsg(m.role,m.html,m.cls)); scrollLog(); }

  /* ---------- chat ---------- */
  const logEl=document.getElementById('log');
  function scrollLog(){ logEl.scrollTop=logEl.scrollHeight; }
  function renderMsg(role,html,cls){ const w=document.createElement('div'); w.className='msg '+(role==='me'?'me':'bot'); w.innerHTML='<div class="bubble '+(cls?('t-'+cls):'')+'">'+html+'</div>'; logEl.appendChild(w); }
  function pushMe(t){ const html=esc(t); data.log.push({role:'me',html}); renderMsg('me',html); scrollLog(); }
  function pushBot(html,cls){ data.log.push({role:'bot',html,cls}); renderMsg('bot',html,cls); scrollLog(); }

  const input=document.getElementById('input');
  input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; });
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); handleSend(); }});
  document.getElementById('send').addEventListener('click',handleSend);
  document.querySelectorAll('.suggests button').forEach(b=>b.addEventListener('click',()=>{ input.value=b.dataset.fill; input.focus(); input.dispatchEvent(new Event('input')); }));

  function handleSend(){
    const text=input.value.trim(); if(!text) return;
    pushMe(text); input.value=''; input.style.height='auto';
    if(isQuery(text)){ pushBot(answerQuery(text),'info'); return; }
    const r=parse(text); fileItem(r);
    const t=TYPE[r.type];
    const chip=`<span class="chip"><span class="tdot" style="background:${t.color}"></span>${t.label}</span>`;
    let c;
    if(r.type==='event'){ const p=r.date.split('-'); anchor=new Date(+p[0],+p[1]-1,+p[2]); if(mode==='month') mode='day';
      c=`Blocked <strong>${esc(r.title)}</strong> on ${niceDate(r.date)}${r.start?`, ${fmtRange(r.start,r.end)}`:''}. I'll remind you 15 min before and at the start.`; }
    else if(r.type==='reminder') c=`I'll remind you to <strong>${esc(r.title)}</strong>${r.time?` at ${fmt(r.time)}`:''}${r.date!==today()?` on ${niceDate(r.date)}`:''}.`;
    else c=`Added to your to-dos: <strong>${esc(r.title)}</strong>.`;
    pushBot(c+chip, r.type);
    save(); renderCal(); renderTodos();
  }

  function fileItem(r){
    const id=uid();
    if(r.type==='event'){ const cat=guessCat(r.raw); const e={id,title:r.title,date:r.date,start:r.start,end:r.end,category:cat}; data.events.push(e); backendForEvent(e); }
    else if(r.type==='reminder'){ const tab=guessTab(r.raw); const tk={id,tabId:tab,text:r.title,done:false,due:r.date,time:r.time||null,reminder:true}; data.tasks.push(tk); backendForReminder(tk); }
    else { const tab=guessTab(r.raw); data.tasks.push({id,tabId:tab,text:r.title,done:false,due:(r.date!==today()?r.date:null),time:null,reminder:false}); }
  }
  function guessCat(text){ const t=text.toLowerCase(); const h=data.categories.find(c=>t.includes(c.name.toLowerCase())); return h?h.id:(data.categories[0]||{}).id; }
  function guessTab(text){ const t=text.toLowerCase(); const h=data.tabs.find(tb=>t.includes(tb.name.toLowerCase())); return h?h.id:(data.tabs[0]||{}).id; }

  /* ---------- queries ---------- */
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function isQuery(text){ const l=text.toLowerCase().trim(); return /\?\s*$/.test(l) || /^(what|what'?s|whats|show|list|when|do i have|anything|any )/.test(l) || /\bwhat'?s on\b/.test(l); }
  function answerQuery(text){
    const l=text.toLowerCase(); let date=today(), label='today';
    if(/\btomorrow\b/.test(l)){ date=addDays(1); label='tomorrow'; }
    else { for(let i=0;i<7;i++){ if(new RegExp('\\b'+WEEK[i]+'\\b').test(l)){ date=nextWeekday(i,false); label=niceDate(date); break; } } }
    if(/\b(task|to-?do|to do|pending|open)\b/.test(l) && !/\b(event|calendar|schedule)\b/.test(l)){
      const open=data.tasks.filter(t=>!t.done);
      return open.length?'<strong>Open to-dos:</strong><br>'+open.map(t=>'• '+esc(t.text)+(t.time?' ('+fmt(t.time)+')':'')+(t.due?' — '+shortDate(t.due):'')).join('<br>'):'No open to-dos right now.';
    }
    const evs=data.events.filter(e=>e.date===date).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
    const rem=data.tasks.filter(t=>t.reminder&&t.due===date&&!t.done).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    let out='';
    if(evs.length) out+='<strong>'+cap(label)+'’s schedule:</strong><br>'+evs.map(e=>'• '+(e.start?fmtRange(e.start,e.end)+' — ':'')+esc(e.title)).join('<br>');
    if(rem.length) out+=(out?'<br><br>':'')+'<strong>Reminders:</strong><br>'+rem.map(r=>'• '+(r.time?fmt(r.time)+' — ':'')+esc(r.text)).join('<br>');
    return out||('Nothing scheduled for '+label+'. 🎾');
  }

  /* ---------- parser ---------- */
  const WEEK=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  const EVENT_WORDS=/\b(block|event|calendar|meeting|dinner|lunch|breakfast|brunch|appointment|party|class|practice|match|game|session|coffee|drinks|catch ?up|call with|standup|interview)\b/i;
  const MONTHS={jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11};
  const MONRE='jan|january|feb|february|mar|march|apr|april|may|jun|june|jul|july|aug|august|sep|sept|september|oct|october|nov|november|dec|december';
  function fromMonthDay(mo,d){ const t=new Date(); t.setHours(0,0,0,0); let dt=new Date(t.getFullYear(),mo,d); dt.setHours(0,0,0,0); if(dt<t) dt=new Date(t.getFullYear()+1,mo,d); return iso(dt); }
  function fromDayOfMonth(d){ const t=new Date(); t.setHours(0,0,0,0); let dt=new Date(t.getFullYear(),t.getMonth(),d); dt.setHours(0,0,0,0); if(dt<t) dt=new Date(t.getFullYear(),t.getMonth()+1,d); return iso(dt); }
  function resolveDateFromText(lower){
    let m;
    if((m=lower.match(/\btomorrow\b/))) return {date:addDays(1),span:[m.index,m.index+m[0].length]};
    if((m=lower.match(/\btonight\b/))) return {date:today(),span:[m.index,m.index+m[0].length]};
    if((m=lower.match(/\btoday\b/))) return {date:today(),span:[m.index,m.index+m[0].length]};
    if((m=lower.match(/\bin\s+(\d{1,2})\s+days?\b/))) return {date:addDays(parseInt(m[1],10)),span:[m.index,m.index+m[0].length]};
    if((m=lower.match(new RegExp('\\b('+MONRE+')\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b')))) return {date:fromMonthDay(MONTHS[m[1]],parseInt(m[2],10)),span:[m.index,m.index+m[0].length]};
    if((m=lower.match(new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?('+MONRE+')\\b')))) return {date:fromMonthDay(MONTHS[m[2]],parseInt(m[1],10)),span:[m.index,m.index+m[0].length]};
    if((m=lower.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){ const mo=parseInt(m[1],10)-1,d=parseInt(m[2],10),y=m[3]?(m[3].length===2?2000+parseInt(m[3],10):parseInt(m[3],10)):null; if(mo>=0&&mo<12&&d>=1&&d<=31) return {date:y?iso(new Date(y,mo,d)):fromMonthDay(mo,d),span:[m.index,m.index+m[0].length]}; }
    for(let i=0;i<7;i++){ const w=lower.match(new RegExp('\\b(next\\s+)?'+WEEK[i]+'\\b')); if(w) return {date:nextWeekday(i,!!w[1]),span:[w.index,w.index+w[0].length]}; }
    if((m=lower.match(/\bthe\s+(\d{1,2})(?:st|nd|rd|th)\b/))||(m=lower.match(/\b(\d{1,2})(?:st|nd|rd|th)\b/))){ const d=parseInt(m[1],10); if(d>=1&&d<=31) return {date:fromDayOfMonth(d),span:[m.index,m.index+m[0].length]}; }
    return null;
  }
  function parse(text){
    const raw=text; let spans=[]; const lower=text.toLowerCase();
    let date=today(); const dres=resolveDateFromText(lower); if(dres){ date=dres.date; spans.push(dres.span); }
    let start=null,end=null,time=null;
    const range=lower.match(/(?:from\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to|until|till)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
    if(range){ let a1=range[3],a2=range[6]; if(!a1&&a2)a1=a2; if(!a2&&a1)a2=a1; start=to24(+range[1],range[2]?+range[2]:0,a1); end=to24(+range[4],range[5]?+range[5]:0,a2); spans.push([range.index,range.index+range[0].length]); }
    else { const single=lower.match(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/)||lower.match(/\bat\s+(\d{1,2})(?::(\d{2}))?\b/); if(single){ time=to24(+single[1],single[2]?+single[2]:0,single[3]); spans.push([single.index,single.index+single[0].length]); } const noon=lower.match(/\bnoon\b/); if(noon&&!time){ time='12:00'; spans.push([noon.index,noon.index+noon[0].length]); } }
    let type;
    const saysR=/\bremind(er)?\b/i.test(text), saysT=/\b(to-?do|task)\b/i.test(text), saysE=EVENT_WORDS.test(text);
    if(start!==null) type='event'; else if(saysE&&!saysR) type='event'; else if(saysR) type='reminder'; else if(saysT) type='todo'; else if(time) type='reminder'; else type='todo';
    if(type==='event'&&start===null&&time!==null){ start=time; end=addHour(time); }
    let title=cut(text,spans)
      .replace(/^\s*(set|add|create|schedule|make|put|new|block)\s+(a|an|the)?\s*(calendar\s+event|event|reminder|to-?do|task|meeting|appointment|time)?\s*/i,'')
      .replace(/^\s*(to|on|in)\s+(my\s+)?calendar\s*/i,'').replace(/^\s*calendar\s*/i,'')
      .replace(/^\s*remind me to\s*/i,'').replace(/^\s*remind me\s*/i,'').replace(/^\s*remember to\s*/i,'')
      .replace(/[:,\-–]/g,' ').replace(/\s+/g,' ').trim();
    let g=0; while(g++<8){ const m=title.match(/^(to|for|from|at|on|of|the|a|an|about|with)\b\s*/i); if(!m)break; title=title.slice(m[0].length); }
    title=title.replace(/\s+/g,' ').trim(); if(!title) title=type==='event'?'Untitled event':(type==='reminder'?'Reminder':'To-do');
    title=title.charAt(0).toUpperCase()+title.slice(1);
    return {type,title,date,start,end,time,raw};
  }
  function cut(text,spans){ spans.sort((a,b)=>b[0]-a[0]); let o=text; spans.forEach(s=>{ o=o.slice(0,s[0])+' '+o.slice(s[1]); }); return o; }
  function to24(h,m,ap){ ap=ap?ap.toLowerCase():null; if(ap==='pm'&&h<12)h+=12; if(ap==='am'&&h===12)h=0; if(!ap&&h<8)h+=12; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
  function addHour(t){ let[h,m]=t.split(':').map(Number); h=(h+1)%24; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }

  /* ---------- calendar ---------- */
  document.querySelectorAll('.viewseg button').forEach(b=>b.addEventListener('click',()=>{ mode=b.dataset.mode; renderCal(); }));
  document.getElementById('prevBtn').addEventListener('click',()=>{ shiftAnchor(-1); });
  document.getElementById('nextBtn').addEventListener('click',()=>{ shiftAnchor(1); });
  document.getElementById('todayNav').addEventListener('click',()=>{ anchor=new Date(); renderCal(); });
  document.getElementById('newEventBtn').addEventListener('click',()=>openModal(null, iso(anchor), '09:00','10:00'));
  function shiftAnchor(dir){ const d=new Date(anchor); if(mode==='month') d.setMonth(d.getMonth()+dir); else if(mode==='week') d.setDate(d.getDate()+7*dir); else d.setDate(d.getDate()+dir); anchor=d; renderCal(); }

  function renderCal(){
    document.querySelectorAll('.viewseg button').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));
    document.getElementById('legend').innerHTML=data.categories.map(c=>`<span class="it"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</span>`).join('');
    if(mode==='month') renderMonth(); else renderTimeGrid(mode==='week'?7:1);
    renderCats();
  }

  function renderMonth(){
    const y=anchor.getFullYear(), mo=anchor.getMonth();
    const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('calTitle').textContent=MN[mo]+' '+y;
    const first=new Date(y,mo,1), off=first.getDay(), dim=new Date(y,mo+1,0).getDate(), dpm=new Date(y,mo,0).getDate();
    const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; let html=dow.map(d=>`<div class="dow">${d}</div>`).join('');
    const cells=[]; for(let i=off-1;i>=0;i--) cells.push({day:dpm-i,other:true});
    for(let d=1;d<=dim;d++) cells.push({day:d,other:false,date:y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')});
    let f=1; while(cells.length%7!==0) cells.push({day:f++,other:true});
    const td=today();
    html+=cells.map(c=>{
      if(c.other) return `<div class="mcell other"><div class="mdn">${c.day}</div></div>`;
      const evs=data.events.filter(e=>e.date===c.date).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
      const bars=evs.slice(0,3).map(e=>`<div class="mbar" style="background:${catColor(e.category)}">${e.start?fmt(e.start).replace(':00',''):''} ${esc(e.title)}</div>`).join('');
      return `<div class="mcell ${c.date===td?'today':''}" data-date="${c.date}"><div class="mdn">${c.day}</div>${bars}${evs.length>3?`<div class="mbar" style="background:#bbb">+${evs.length-3}</div>`:''}</div>`;
    }).join('');
    const body=document.getElementById('calBody'); body.innerHTML=`<div class="mgrid">${html}</div>`;
    body.querySelectorAll('.mcell[data-date]').forEach(c=>c.addEventListener('click',()=>{ const p=c.dataset.date.split('-'); anchor=new Date(+p[0],+p[1]-1,+p[2]); mode='day'; renderCal(); }));
  }

  function renderTimeGrid(days){
    const start=new Date(anchor); if(days===7) start.setDate(start.getDate()-start.getDay());
    const cols=[]; for(let i=0;i<days;i++){ const d=new Date(start); d.setDate(d.getDate()+i); cols.push(d); }
    if(days===7){ const a=cols[0], b=cols[6]; document.getElementById('calTitle').textContent=a.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+b.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
    else document.getElementById('calTitle').textContent=cols[0].toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});

    const td=today();
    const gridCols='52px repeat('+days+',1fr)';
    let head=`<div class="tg-head" style="grid-template-columns:${gridCols}"><div></div>`;
    cols.forEach(d=>{ const ds=iso(d); head+=`<div class="hd-day ${ds===td?'today':''}"><span>${d.toLocaleDateString(undefined,{weekday:'short'})}</span><span class="num">${d.getDate()}</span></div>`; });
    head+='</div>';
    let allday=`<div class="tg-head" style="grid-template-columns:${gridCols}"><div style="font-size:9px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;">all-day</div>`;
    cols.forEach(d=>{ const ds=iso(d); const ad=data.events.filter(e=>e.date===ds && !e.start); allday+=`<div class="allday" data-date="${ds}">`+ad.map(e=>`<span class="adchip" style="background:${catColor(e.category)}" data-ev="${e.id}">${esc(e.title)}</span>`).join('')+`</div>`; });
    allday+='</div>';
    let times=''; for(let h=0;h<24;h++){ times+=`<div class="tg-time"><span>${h===0?'12a':h<12?h+'a':h===12?'12p':(h-12)+'p'}</span></div>`; }
    let body=`<div class="tg-cols" style="grid-template-columns:${gridCols}"><div class="tg-times">${times}</div>`;
    cols.forEach(d=>{ const ds=iso(d); body+=`<div class="daycol ${ds===td?'today':''}" data-date="${ds}" style="height:${24*HOUR_H}px">`+ dayEventsHtml(ds) +`</div>`; });
    body+='</div>';
    const bodyEl=document.getElementById('calBody');
    bodyEl.innerHTML=`<div class="tg">${head}${allday}<div class="tg-body">${body}</div></div>`;
    const tb=bodyEl.querySelector('.tg-body'); if(tb) tb.scrollTop=7*HOUR_H;
    bodyEl.querySelectorAll('.daycol').forEach(col=>{
      col.addEventListener('click',ev=>{
        if(ev.target.closest('.evblock')) return;
        const rect=col.getBoundingClientRect(); const y=ev.clientY-rect.top; let mins=Math.round((y/HOUR_H*60)/30)*30; if(mins<0)mins=0; if(mins>23*60)mins=23*60;
        openModal(null, col.dataset.date, minToTime(mins), minToTime(Math.min(mins+60,24*60-1)));
      });
    });
    bodyEl.querySelectorAll('.evblock').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); const ev=data.events.find(x=>x.id===b.dataset.ev); if(ev) openModal(ev); }));
    bodyEl.querySelectorAll('.adchip').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); const ev=data.events.find(x=>x.id===b.dataset.ev); if(ev) openModal(ev); }));
  }
  function dayEventsHtml(ds){
    const evs=data.events.filter(e=>e.date===ds && e.start);
    return evs.map(e=>{ const s=toMin(e.start), en=e.end?toMin(e.end):s+60; const top=s/60*HOUR_H; const h=Math.max((en-s)/60*HOUR_H,18);
      return `<div class="evblock" data-ev="${e.id}" style="top:${top}px;height:${h}px;background:${catColor(e.category)}"><div class="et">${esc(e.title)}</div><div class="es">${fmtRange(e.start,e.end)}</div></div>`; }).join('');
  }

  function renderCats(){
    document.getElementById('catList').innerHTML=data.categories.map(c=>`<span class="catchip"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}<button class="x" data-id="${c.id}">✕</button></span>`).join('');
    document.querySelectorAll('#catList .x').forEach(b=>b.addEventListener('click',()=>{ data.categories=data.categories.filter(c=>c.id!==b.dataset.id); save(); renderCal(); }));
  }
  function catColor(id){ const c=data.categories.find(x=>x.id===id); return c?c.color:'#C9C6BA'; }
  document.getElementById('catAdd').addEventListener('click',()=>{ const n=document.getElementById('catName').value.trim(); if(!n)return; data.categories.push({id:uid(),name:n,color:document.getElementById('catColor').value}); document.getElementById('catName').value=''; save(); renderCal(); });

  /* ---------- event modal ---------- */
  const overlay=document.getElementById('overlay');
  function openModal(ev, date, start, end){
    editingId = ev?ev.id:null;
    document.getElementById('modalTitle').textContent = ev?'Edit event':'New event';
    document.getElementById('mTitle').value = ev?ev.title:'';
    document.getElementById('mDate').value = ev?ev.date:(date||today());
    document.getElementById('mStart').value = ev?(ev.start||'09:00'):(start||'09:00');
    document.getElementById('mEnd').value = ev?(ev.end||'10:00'):(end||'10:00');
    document.getElementById('mCat').innerHTML=data.categories.map(c=>`<option value="${c.id}" ${ev&&ev.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
    document.getElementById('mDelete').style.display = ev?'inline':'none';
    overlay.classList.add('show');
  }
  function closeModal(){ overlay.classList.remove('show'); editingId=null; }
  document.getElementById('mCancel').addEventListener('click',closeModal);
  overlay.addEventListener('click',e=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('mSave').addEventListener('click',()=>{
    const title=document.getElementById('mTitle').value.trim()||'Untitled event';
    const date=document.getElementById('mDate').value||today();
    const start=document.getElementById('mStart').value||null;
    let end=document.getElementById('mEnd').value||null;
    if(start&&end&&end<=start){ const d=new Date('2000-01-01T'+start+':00'); d.setHours(d.getHours()+1); end=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
    const category=document.getElementById('mCat').value;
    if(editingId){ const e=data.events.find(x=>x.id===editingId); if(e){ e.title=title; e.date=date; e.start=start; e.end=end; e.category=category; } }
    else { const e={id:uid(),title,date,start,end,category}; data.events.push(e); backendForEvent(e); }
    closeModal(); save(); renderCal();
  });
  document.getElementById('mDelete').addEventListener('click',()=>{ if(editingId){ data.events=data.events.filter(x=>x.id!==editingId); } closeModal(); save(); renderCal(); });

  /* ---------- todos ---------- */
  function renderTodos(){
    if(!data.tabs.find(t=>t.id===activeTab)) activeTab=(data.tabs[0]||{}).id;
    document.getElementById('tabbar').innerHTML=data.tabs.map(t=>`<button class="tbtn ${t.id===activeTab?'active':''}" data-id="${t.id}">${esc(t.name)}</button>`).join('')+`<button class="tbtn add" id="addTab">+ Tab</button>`;
    document.querySelectorAll('#tabbar .tbtn[data-id]').forEach(b=>b.addEventListener('click',()=>{ activeTab=b.dataset.id; renderTodos(); }));
    document.getElementById('addTab').addEventListener('click',()=>{ const n=prompt('Name this tab (e.g. Study, Errands, Tennis)'); if(n&&n.trim()){ const id=uid(); data.tabs.push({id,name:n.trim()}); activeTab=id; save(); renderTodos(); } });
    const td=today();
    const list=data.tasks.filter(t=>t.tabId===activeTab).sort((a,b)=>(a.done-b.done)||((a.due||'9999')+(a.time||'')).localeCompare((b.due||'9999')+(b.time||'')));
    document.getElementById('taskWrap').innerHTML=list.length?list.map(t=>{
      const over=t.due&&!t.done&&t.due<td; let badge='';
      if(t.reminder&&(t.time||t.due)) badge=`<span class="badge ${over?'over':''}">⏰ ${t.time?fmt(t.time):''}${t.due&&t.due!==td?' · '+shortDate(t.due):''}</span>`;
      else if(t.due) badge=`<span class="badge ${over?'over':''}">${shortDate(t.due)}</span>`;
      return `<div class="trow ${t.done?'done':''}"><input type="checkbox" data-id="${t.id}" ${t.done?'checked':''}><span class="tt">${esc(t.text)}</span>${badge}<button class="x" data-id="${t.id}">✕</button></div>`;
    }).join(''):'<div class="empty"><div class="big">This tab is empty</div>Tell me in Chat and I\'ll add it here.</div>';
    document.querySelectorAll('#taskWrap input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>{ const t=data.tasks.find(x=>x.id===cb.dataset.id); t.done=cb.checked; save(); renderTodos(); }));
    document.querySelectorAll('#taskWrap .x').forEach(b=>b.addEventListener('click',()=>{ data.tasks=data.tasks.filter(t=>t.id!==b.dataset.id); save(); renderTodos(); }));
  }

  /* ---------- import / export ---------- */
  document.getElementById('impIcs').addEventListener('click',()=>document.getElementById('icsFile').click());
  document.getElementById('icsFile').addEventListener('change',ev=>{ const f=ev.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ const text=String(rd.result); const events=parseICS(text); const cn=(text.match(/X-WR-CALNAME:(.*)/)||[])[1]||''; importICS(events, unescapeICS(cn)); }; rd.readAsText(f); ev.target.value=''; });
  document.getElementById('expIcs').addEventListener('click',exportICS);
  document.getElementById('backupBtn').addEventListener('click',()=>download('nandini-backup.json',JSON.stringify(data,null,2),'application/json'));
  document.getElementById('restoreBtn').addEventListener('click',()=>document.getElementById('jsonFile').click());
  document.getElementById('jsonFile').addEventListener('change',ev=>{ const f=ev.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ try{ const p=JSON.parse(rd.result); data=Object.assign(data,p); if(!data.tabs.find(t=>t.id===activeTab)) activeTab=(data.tabs[0]||{}).id; save(); renderCal(); renderTodos(); rerenderChat(); alert('Backup restored.'); }catch(e){ alert('That file could not be read.'); } }; rd.readAsText(f); ev.target.value=''; });

  function parseICS(text){
    const u=text.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,''); const lines=u.split('\n'); const out=[]; let cur=null;
    for(const line of lines){ if(line==='BEGIN:VEVENT'){cur={};continue;} if(line==='END:VEVENT'){if(cur)out.push(cur);cur=null;continue;} if(!cur)continue;
      const i=line.indexOf(':'); if(i<0)continue; const left=line.slice(0,i), val=line.slice(i+1), key=left.split(';')[0].toUpperCase();
      if(key==='SUMMARY')cur.summary=unescapeICS(val); else if(key==='LOCATION')cur.location=unescapeICS(val); else if(key==='UID')cur.uid=val.trim();
      else if(key==='DTSTART')Object.assign(cur,parseDT(left,val,'start')); else if(key==='DTEND')Object.assign(cur,parseDT(left,val,'end')); }
    return out;
  }
  function parseDT(left,val,which){ val=val.trim(); const isDate=/VALUE=DATE/i.test(left)||/^\d{8}$/.test(val); const date=val.slice(0,4)+'-'+val.slice(4,6)+'-'+val.slice(6,8); const o={}; o[which+'Date']=date; if(!isDate&&val.length>=13)o[which+'Time']=val.slice(9,11)+':'+val.slice(11,13); return o; }
  function unescapeICS(s){ return String(s).replace(/\\n/gi,' ').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\').trim(); }
  function ensureCategory(name,color){ let c=data.categories.find(x=>x.name.toLowerCase()===name.toLowerCase()); if(c)return c.id; const id=uid(); data.categories.push({id,name,color}); return id; }
  function importICS(list,calName){
    const clean=(list||[]).filter(e=>e.startDate); if(!clean.length){ alert('No events found.'); return; }
    const catName=(calName&&calName.trim())?calName.trim().slice(0,22):'Imported'; const catId=ensureCategory(catName,'#A85C7A');
    const seen=new Set(data.events.map(e=>e.uid).filter(Boolean)); let added=0, earliest=null;
    clean.forEach(e=>{ if(e.uid&&seen.has(e.uid))return; data.events.push({id:uid(),uid:e.uid||null,title:e.summary||'Event',date:e.startDate,start:e.startTime||null,end:e.endTime||null,category:catId,loc:e.location||null}); added++; if(!earliest||e.startDate<earliest)earliest=e.startDate; });
    if(earliest){ const p=earliest.split('-'); anchor=new Date(+p[0],+p[1]-1,+p[2]); mode='week'; }
    save(); renderCal(); alert(added+' event'+(added===1?'':'s')+' added'+(added?' under “'+catName+'”':'')+'.');
  }
  function exportICS(){
    const dt=(date,time)=>{ const p=date.split('-'); if(!time)return p[0]+p[1]+p[2]; const t=time.split(':'); return p[0]+p[1]+p[2]+'T'+t[0]+t[1]+'00'; };
    let out='BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Nandini Hub//EN\nCALSCALE:GREGORIAN\n';
    data.events.forEach(e=>{ out+='BEGIN:VEVENT\nUID:'+(e.uid||e.id+'@nandini-hub')+'\n'; if(e.start){ out+='DTSTART:'+dt(e.date,e.start)+'\nDTEND:'+dt(e.date,e.end||e.start)+'\n'; } else out+='DTSTART;VALUE=DATE:'+dt(e.date,null)+'\n'; out+='SUMMARY:'+icsEsc(e.title)+'\n'; if(e.loc)out+='LOCATION:'+icsEsc(e.loc)+'\n'; out+='END:VEVENT\n'; });
    out+='END:VCALENDAR\n'; download('nandini-calendar.ics',out,'text/calendar');
  }
  function icsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
  function download(name,content,type){ const b=new Blob([content],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href); }

  /* ---------- helpers ---------- */
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function today(){ return iso(new Date()); }
  function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return iso(d); }
  function nextWeekday(idx,f){ const d=new Date(); let diff=(idx-d.getDay()+7)%7; if(diff===0||f)diff=diff===0?7:diff; d.setDate(d.getDate()+diff); return iso(d); }
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function niceDate(d){ const t=today(); if(d===t)return'today'; if(d===addDays(1))return'tomorrow'; return new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}); }
  function shortDate(d){ return new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
  function fmt(t){ let[h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; let hh=h%12; if(hh===0)hh=12; return hh+(m?':'+String(m).padStart(2,'0'):'')+' '+ap; }
  function fmtRange(a,b){ if(!b)return fmt(a); const apA=(+a.split(':')[0])>=12?'PM':'AM',apB=(+b.split(':')[0])>=12?'PM':'AM'; if(apA===apB) return fmt(a).replace(' '+apA,'')+'–'+fmt(b); return fmt(a)+'–'+fmt(b); }
  function toMin(t){ const p=t.split(':').map(Number); return p[0]*60+p[1]; }
  function minToTime(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

  load();
})();
</script>
